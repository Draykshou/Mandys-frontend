name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos; no cancela uno que ya está en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify VITE_API_URL secret exists
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::El secreto VITE_API_URL esta vacio o no existe en GitHub Secrets!"
            exit 1
          fi
          echo "VITE_API_URL detectado correctamente."
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # GitHub Pages sirve el sitio en /<repo>/, p.ej. /Mandys-frontend/
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: SPA fallback (404.html)
        # GitHub Pages no soporta rewrites; copiar index.html a 404.html
        # permite que Vue Router (history mode) resuelva rutas profundas.
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
