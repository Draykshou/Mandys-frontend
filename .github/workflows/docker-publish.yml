name: Build & Push to GHCR

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  # github.repository resolves to <owner>/<repo>, e.g. draykshou/mandys-frontend
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only log in (and push) on real pushes, not PRs from forks
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # branch push  →  ghcr.io/…:latest (instead of branch name)
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            # PR           →  ghcr.io/…:pr-42
            type=ref,event=pr
            # semver tag   →  ghcr.io/…:v1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # always tag the short SHA for traceability
            type=sha,prefix=sha-

      - name: Verify VITE_API_URL secret exists
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::El secreto VITE_API_URL esta vacio o no existe en GitHub Secrets!"
            exit 1
          fi
          echo "VITE_API_URL detectado correctamente."
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # Only push on non-PR events; PRs only build (validates the Dockerfile)
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          # Inline cache: stores cache layers in the image manifest
          cache-from: type=gha
          cache-to: type=gha,mode=max
